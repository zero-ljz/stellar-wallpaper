[project]
name = "stellar-wallpaper"
version = "1.1.0"
description = "星澜壁纸 (Stellar Wallpaper) - 基于 PySide6 的现代化 Windows 桌面壁纸管理与自动轮播客户端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6==6.8.3",
    "pyside6-modern-widgets==0.1.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

